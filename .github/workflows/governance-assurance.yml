name: Governance Assurance Demonstration

on:
  push:
    paths:
      - examples/machine-readable-control/controls/**
      - examples/machine-readable-control/validation/**
      - examples/machine-readable-control/evidence/**
      - examples/machine-readable-control/assurance/**
      - examples/machine-readable-control/automation/**
      - examples/machine-readable-control/events/**
      - examples/machine-readable-control/integrations/**
      - examples/machine-readable-control/sample-data/**
      - .github/workflows/governance-assurance.yml
  workflow_dispatch:
    inputs:
      live_issue_workflow:
        description: Execute the authorized live GitHub Issues workflow
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: governance-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assurance:
    outputs:
      assurance_status: ${{ steps.assurance-pipeline.outputs.assurance_status }}
      workflow_plan_ready: ${{ steps.github-dry-run.outcome == 'success' }}
      runtime_artifact_id: ${{ steps.runtime-artifact-upload.outputs.artifact-id }}
      issue_operations_allowed: ${{ steps.trusted-history.outputs.issue_operations_allowed }}
      publication_allowed: ${{ steps.trusted-history.outputs.publication_allowed }}
      history_resolution_status: ${{ steps.trusted-history.outputs.resolution_status }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/machine-readable-control
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run complete test suite
        run: |
          python -m unittest discover -s validation/tests -v
          python -m unittest discover -s evidence/tests -v
          python -m unittest discover -s assurance/tests -v
          python -m unittest discover -s automation/tests -v
          python -m unittest discover -s events/tests -v
          python -m unittest discover -s integrations/github/tests -v

      - name: Retrieve prior trusted assurance state
        id: prior-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state_directory="$RUNNER_TEMP/trusted-assurance-state"
          runtime_directory="$GITHUB_WORKSPACE/examples/machine-readable-control/generated-assurance"
          mkdir -p "$state_directory"
          mkdir -p "$runtime_directory"
          workflow_runs_file="$RUNNER_TEMP/trusted-state-workflow-runs.json"
          artifacts_file="$RUNNER_TEMP/trusted-state-artifacts.json"
          metadata_file="$runtime_directory/prior-state-metadata.json"
          retrieval_available=true
          if ! gh api --paginate --slurp -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/governance-assurance.yml/runs" -f branch="$GITHUB_REF_NAME" -f status=success -f per_page=100 > "$workflow_runs_file"; then
            jq -n --arg reason "GitHub workflow-run retrieval failed." '{status: "UNAVAILABLE", failure_stage: "API_RETRIEVAL", reason: $reason}' > "$metadata_file"
            retrieval_available=false
          fi
          if [ "$retrieval_available" = true ] && ! gh api --paginate --slurp -X GET "repos/$GITHUB_REPOSITORY/actions/artifacts" -f name=trusted-assurance-state -f per_page=100 > "$artifacts_file"; then
            jq -n --arg reason "GitHub artifact retrieval failed." '{status: "UNAVAILABLE", failure_stage: "API_RETRIEVAL", reason: $reason}' > "$metadata_file"
            retrieval_available=false
          fi
          if [ "$retrieval_available" = false ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "Trusted assurance state retrieval is unavailable."
            exit 0
          fi
          artifact_record="$(jq -cn --slurpfile runs "$workflow_runs_file" --slurpfile artifacts "$artifacts_file" --argjson run_id "$GITHUB_RUN_ID" '[$runs[0][].workflow_runs[].id] as $trusted_run_ids | [$artifacts[0][].artifacts[] | select(.expired == false and .workflow_run.id != $run_id) | . as $artifact | select($trusted_run_ids | index($artifact.workflow_run.id))] | sort_by([.created_at, .id]) | reverse | .[0] // empty')"
          artifact_id="$(jq -r '.id // empty' <<< "$artifact_record")"
          if [ -n "$artifact_id" ]; then
            source_run_id="$(jq -r '.workflow_run.id' <<< "$artifact_record")"
            artifact_name="$(jq -r '.name' <<< "$artifact_record")"
            if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$state_directory/state.zip" || ! unzip -q "$state_directory/state.zip" -d "$state_directory"; then
              jq -n --arg reason "Trusted-state artifact download or extraction failed." --arg source_run_id "$source_run_id" --arg artifact_id "$artifact_id" --arg artifact_name "$artifact_name" '{status: "UNAVAILABLE", failure_stage: "ARTIFACT_DOWNLOAD", source_run_id: $source_run_id, artifact_id: $artifact_id, artifact_name: $artifact_name, reason: $reason}' > "$metadata_file"
              echo "path=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            jq -n --arg source_run_id "$source_run_id" --arg artifact_id "$artifact_id" --arg artifact_name "$artifact_name" '{status: "FOUND", source_run_id: $source_run_id, artifact_id: $artifact_id, artifact_name: $artifact_name, reason: "Newest eligible trusted assurance state retrieved for validation."}' > "$metadata_file"
            echo "path=$state_directory/trusted-assurance-state.json" >> "$GITHUB_OUTPUT"
            echo "Prior trusted assurance state retrieved."
          else
            expired_record="$(jq -cn --slurpfile runs "$workflow_runs_file" --slurpfile artifacts "$artifacts_file" --argjson run_id "$GITHUB_RUN_ID" '[$runs[0][].workflow_runs[].id] as $trusted_run_ids | [$artifacts[0][].artifacts[] | select(.expired == true and .workflow_run.id != $run_id) | . as $artifact | select($trusted_run_ids | index($artifact.workflow_run.id))] | sort_by([.created_at, .id]) | reverse | .[0] // empty')"
            if [ -n "$(jq -r '.id // empty' <<< "$expired_record")" ]; then
              jq -n --arg reason "Previously published trusted assurance state is expired." --arg source_run_id "$(jq -r '.workflow_run.id' <<< "$expired_record")" --arg artifact_id "$(jq -r '.id' <<< "$expired_record")" --arg artifact_name "$(jq -r '.name' <<< "$expired_record")" '{status: "EXPIRED", source_run_id: $source_run_id, artifact_id: $artifact_id, artifact_name: $artifact_name, reason: $reason}' > "$metadata_file"
            elif jq -e --argjson run_id "$GITHUB_RUN_ID" '[.[].artifacts[] | select(.workflow_run.id != $run_id)] | length > 0' "$artifacts_file" > /dev/null; then
              jq -n '{status: "INELIGIBLE", reason: "Trusted-state artifacts exist, but none satisfy the successful-run eligibility rules."}' > "$metadata_file"
            else
              jq -n '{status: "ABSENT", reason: "No trusted-state artifact is present for the established lineage."}' > "$metadata_file"
            fi
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No active eligible trusted assurance state was found."
          fi

      - name: Resolve trusted assurance history
        id: trusted-history
        run: |
          evaluation_date="$(date -u +%F)"
          python -m automation.state_resolution \
            --lineage automation/trusted-state-lineage.json \
            --retrieval-metadata generated-assurance/prior-state-metadata.json \
            --state "${{ steps.prior-state.outputs.path }}" \
            --control-id ACP-001-03 \
            --evaluation-date "$evaluation_date" \
            --output generated-assurance/trusted-state-resolution.json
          echo "evaluation_date=$evaluation_date" >> "$GITHUB_OUTPUT"

      - name: Run synthetic assurance pipeline
        id: assurance-pipeline
        env:
          PREVIOUS_STATE_PATH: ${{ steps.prior-state.outputs.path }}
        run: |
          arguments=(--evaluation-date "${{ steps.trusted-history.outputs.evaluation_date }}" --state-resolution generated-assurance/trusted-state-resolution.json)
          if [ -n "$PREVIOUS_STATE_PATH" ]; then
            arguments+=(--previous-state "$PREVIOUS_STATE_PATH")
          fi
          python -m automation.cli "${arguments[@]}"

      - name: Plan GitHub governance workflow operations
        id: github-dry-run
        if: ${{ always() && steps.trusted-history.outputs.issue_operations_allowed == 'true' && (steps.assurance-pipeline.outputs.assurance_status == 'verified' || steps.assurance-pipeline.outputs.assurance_status == 'integrity_halt') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m integrations.github.cli --dry-run

      - name: Upload synthetic demonstration artifacts
        id: runtime-artifact-upload
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: synthetic-governance-assurance-${{ github.run_id }}
          path: examples/machine-readable-control/generated-assurance/
          if-no-files-found: warn
          retention-days: 7

  live-governance-workflow:
    name: Authorized live GitHub governance workflow
    needs: assurance
    outputs:
      executed_operations: ${{ steps.live-operation-metadata.outputs.operations }}
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.live_issue_workflow == true && needs.assurance.outputs.issue_operations_allowed == 'true' && needs.assurance.outputs.workflow_plan_ready == 'true' && (needs.assurance.outputs.assurance_status == 'verified' || needs.assurance.outputs.assurance_status == 'integrity_halt') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    defaults:
      run:
        working-directory: examples/machine-readable-control
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download generated governance events
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: synthetic-governance-assurance-${{ github.run_id }}
          path: examples/machine-readable-control/generated-assurance

      - name: Execute authorized GitHub governance workflow
        id: live-execution
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_ISSUE_WORKFLOW: ${{ inputs.live_issue_workflow }}
        run: python -m integrations.github.cli --live --output generated-assurance/executed-github-issue-operations.json

      - name: Surface executed operation metadata
        id: live-operation-metadata
        if: always()
        run: |
          operations_file="generated-assurance/executed-github-issue-operations.json"
          if [ -f "$operations_file" ]; then
            echo "operations=$(jq -c . "$operations_file")" >> "$GITHUB_OUTPUT"
          else
            echo "operations=[]" >> "$GITHUB_OUTPUT"
          fi

  trusted-state-publication:
    name: Publish trusted assurance state
    needs:
      - assurance
      - live-governance-workflow
    outputs:
      publication_decision: ${{ steps.state-publication.outputs.publication_decision }}
      publication_reason: ${{ steps.state-publication.outputs.publication_reason }}
      candidate_state_available: ${{ steps.state-publication.outputs.candidate_state_available }}
      state_ready: ${{ steps.state-publication.outputs.state_ready }}
      upload_status: ${{ steps.trusted-state-upload.outcome }}
      authoritative_artifact_id: ${{ steps.trusted-state-upload.outputs.artifact-id }}
    if: ${{ always() && (needs.assurance.outputs.assurance_status == 'verified' || needs.assurance.outputs.assurance_status == 'integrity_halt' || needs.assurance.outputs.assurance_status == 'history_unresolved') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: examples/machine-readable-control
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Download candidate trusted state
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: synthetic-governance-assurance-${{ github.run_id }}
          path: examples/machine-readable-control/generated-assurance

      - name: Evaluate trusted state publication
        id: state-publication
        run: |
          python -m automation.state_publication \
            --assurance-status "${{ needs.assurance.outputs.assurance_status }}" \
            --event-name "${{ github.event_name }}" \
            --live-requested "${{ inputs.live_issue_workflow == true }}" \
            --live-job-result "${{ needs.live-governance-workflow.result }}" \
            --trusted-history-publication-allowed "${{ needs.assurance.outputs.publication_allowed }}" \
            --events-directory generated-assurance/events \
            --candidate-state generated-assurance/trusted-assurance-state.json \
            --publication-directory "${{ runner.temp }}/trusted-state-publication"

      - name: Upload trusted assurance state
        id: trusted-state-upload
        if: ${{ steps.state-publication.outputs.state_ready == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: trusted-assurance-state
          path: ${{ runner.temp }}/trusted-state-publication/trusted-assurance-state.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  lifecycle-diagnostics:
    name: Governance assurance lifecycle diagnostics
    needs:
      - assurance
      - live-governance-workflow
      - trusted-state-publication
    if: ${{ always() }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: examples/machine-readable-control
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download assurance runtime artifact
        if: ${{ needs.assurance.outputs.runtime_artifact_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: synthetic-governance-assurance-${{ github.run_id }}
          path: examples/machine-readable-control/generated-assurance

      - name: Render lifecycle diagnostics
        if: always()
        continue-on-error: true
        run: |
          python -m automation.diagnostics \
            --runtime-directory generated-assurance \
            --output-directory "${{ runner.temp }}/lifecycle-diagnostics" \
            --repository "${{ github.repository }}" \
            --workflow "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-number "${{ github.run_number }}" \
            --trigger "${{ github.event_name }}" \
            --branch "${{ github.ref_name }}" \
            --commit-sha "${{ github.sha }}" \
            --live-requested "${{ github.event_name == 'workflow_dispatch' && inputs.live_issue_workflow == true }}" \
            --live-authorized "${{ github.event_name == 'workflow_dispatch' && inputs.live_issue_workflow == true }}" \
            --live-job-status "${{ needs.live-governance-workflow.result }}" \
            --executed-operations '${{ needs.live-governance-workflow.outputs.executed_operations }}' \
            --publication-status "${{ needs.trusted-state-publication.outputs.state_ready == 'true' && needs.trusted-state-publication.outputs.upload_status == 'success' && 'PROMOTED' || (needs.trusted-state-publication.outputs.publication_decision == 'DO_NOT_PROMOTE' && 'WITHHELD' || (needs.trusted-state-publication.outputs.publication_decision == 'PROMOTE' && 'FAILED' || 'NOT_REACHED')) }}" \
            --publication-decision "${{ needs.trusted-state-publication.outputs.publication_decision }}" \
            --publication-reason "${{ needs.trusted-state-publication.outputs.publication_reason }}" \
            --candidate-state-available "${{ needs.trusted-state-publication.outputs.candidate_state_available == 'true' }}" \
            --candidate-promoted "${{ needs.trusted-state-publication.outputs.upload_status == 'success' }}" \
            --upload-status "${{ needs.trusted-state-publication.outputs.upload_status }}" \
            --authoritative-artifact-id "${{ needs.trusted-state-publication.outputs.authoritative_artifact_id }}" \
            --workflow-conclusion "assurance=${{ needs.assurance.result }},live=${{ needs.live-governance-workflow.result }},publication=${{ needs.trusted-state-publication.result }}"

      - name: Upload lifecycle diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: synthetic-governance-lifecycle-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/lifecycle-diagnostics/
          if-no-files-found: warn
          retention-days: 7
