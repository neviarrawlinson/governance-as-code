name: Governance Assurance Demonstration

on:
  push:
    paths:
      - examples/machine-readable-control/controls/**
      - examples/machine-readable-control/validation/**
      - examples/machine-readable-control/evidence/**
      - examples/machine-readable-control/assurance/**
      - examples/machine-readable-control/automation/**
      - examples/machine-readable-control/events/**
      - examples/machine-readable-control/integrations/**
      - examples/machine-readable-control/sample-data/**
      - .github/workflows/governance-assurance.yml
  workflow_dispatch:
    inputs:
      live_issue_workflow:
        description: Execute the authorized live GitHub Issues workflow
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: governance-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assurance:
    outputs:
      assurance_status: ${{ steps.assurance-pipeline.outputs.assurance_status }}
      workflow_plan_ready: ${{ steps.github-dry-run.outcome == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/machine-readable-control
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run complete test suite
        run: |
          python -m unittest discover -s validation/tests -v
          python -m unittest discover -s evidence/tests -v
          python -m unittest discover -s assurance/tests -v
          python -m unittest discover -s automation/tests -v
          python -m unittest discover -s events/tests -v
          python -m unittest discover -s integrations/github/tests -v

      - name: Retrieve prior trusted assurance state
        id: prior-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state_directory="$RUNNER_TEMP/trusted-assurance-state"
          mkdir -p "$state_directory"
          workflow_runs_file="$RUNNER_TEMP/trusted-state-workflow-runs.json"
          artifacts_file="$RUNNER_TEMP/trusted-state-artifacts.json"
          gh api --paginate --slurp -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/governance-assurance.yml/runs" -f branch="$GITHUB_REF_NAME" -f status=success -f per_page=100 > "$workflow_runs_file"
          gh api --paginate --slurp -X GET "repos/$GITHUB_REPOSITORY/actions/artifacts" -f name=trusted-assurance-state -f per_page=100 > "$artifacts_file"
          artifact_id="$(jq -nr --slurpfile runs "$workflow_runs_file" --slurpfile artifacts "$artifacts_file" --argjson run_id "$GITHUB_RUN_ID" '[$runs[0][].workflow_runs[].id] as $trusted_run_ids | [$artifacts[0][].artifacts[] | select(.expired == false and .workflow_run.id != $run_id) | . as $artifact | select($trusted_run_ids | index($artifact.workflow_run.id))] | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$state_directory/state.zip"
            unzip -q "$state_directory/state.zip" -d "$state_directory"
            echo "path=$state_directory/trusted-assurance-state.json" >> "$GITHUB_OUTPUT"
            echo "Prior trusted assurance state retrieved."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No prior trusted assurance state is available."
          fi

      - name: Run synthetic assurance pipeline
        id: assurance-pipeline
        env:
          PREVIOUS_STATE_PATH: ${{ steps.prior-state.outputs.path }}
        run: |
          arguments=()
          if [ -n "$PREVIOUS_STATE_PATH" ]; then
            arguments+=(--previous-state "$PREVIOUS_STATE_PATH")
          fi
          python -m automation.cli "${arguments[@]}"

      - name: Plan GitHub governance workflow operations
        id: github-dry-run
        if: ${{ always() && (steps.assurance-pipeline.outputs.assurance_status == 'verified' || steps.assurance-pipeline.outputs.assurance_status == 'integrity_halt') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m integrations.github.cli --dry-run

      - name: Upload synthetic demonstration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-governance-assurance-${{ github.run_id }}
          path: examples/machine-readable-control/generated-assurance/
          if-no-files-found: warn
          retention-days: 7

  live-governance-workflow:
    name: Authorized live GitHub governance workflow
    needs: assurance
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.live_issue_workflow == true && needs.assurance.outputs.workflow_plan_ready == 'true' && (needs.assurance.outputs.assurance_status == 'verified' || needs.assurance.outputs.assurance_status == 'integrity_halt') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    defaults:
      run:
        working-directory: examples/machine-readable-control
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download generated governance events
        uses: actions/download-artifact@v4
        with:
          name: synthetic-governance-assurance-${{ github.run_id }}
          path: examples/machine-readable-control/generated-assurance

      - name: Execute authorized GitHub governance workflow
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_ISSUE_WORKFLOW: ${{ inputs.live_issue_workflow }}
        run: python -m integrations.github.cli --live

  trusted-state-publication:
    name: Publish trusted assurance state
    needs:
      - assurance
      - live-governance-workflow
    if: ${{ always() && (needs.assurance.outputs.assurance_status == 'verified' || needs.assurance.outputs.assurance_status == 'integrity_halt') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: examples/machine-readable-control
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download candidate trusted state
        uses: actions/download-artifact@v4
        with:
          name: synthetic-governance-assurance-${{ github.run_id }}
          path: examples/machine-readable-control/generated-assurance

      - name: Evaluate trusted state publication
        id: state-publication
        run: |
          python -m automation.state_publication \
            --assurance-status "${{ needs.assurance.outputs.assurance_status }}" \
            --event-name "${{ github.event_name }}" \
            --live-requested "${{ inputs.live_issue_workflow == true }}" \
            --live-job-result "${{ needs.live-governance-workflow.result }}" \
            --events-directory generated-assurance/events \
            --candidate-state generated-assurance/trusted-assurance-state.json \
            --publication-directory "${{ runner.temp }}/trusted-state-publication"

      - name: Upload trusted assurance state
        if: ${{ steps.state-publication.outputs.state_ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: trusted-assurance-state
          path: ${{ runner.temp }}/trusted-state-publication/trusted-assurance-state.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
