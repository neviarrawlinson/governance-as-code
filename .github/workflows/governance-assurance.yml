name: Governance Assurance Demonstration

on:
  push:
    paths:
      - examples/machine-readable-control/controls/**
      - examples/machine-readable-control/validation/**
      - examples/machine-readable-control/evidence/**
      - examples/machine-readable-control/assurance/**
      - examples/machine-readable-control/automation/**
      - examples/machine-readable-control/events/**
      - examples/machine-readable-control/integrations/**
      - examples/machine-readable-control/sample-data/**
      - .github/workflows/governance-assurance.yml
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: governance-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assurance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/machine-readable-control
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run complete test suite
        run: |
          python -m unittest discover -s validation/tests -v
          python -m unittest discover -s evidence/tests -v
          python -m unittest discover -s assurance/tests -v
          python -m unittest discover -s automation/tests -v
          python -m unittest discover -s events/tests -v
          python -m unittest discover -s integrations/github/tests -v

      - name: Retrieve prior trusted assurance state
        id: prior-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state_directory="$RUNNER_TEMP/trusted-assurance-state"
          mkdir -p "$state_directory"
          workflow_runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/governance-assurance.yml/runs" -f branch="$GITHUB_REF_NAME" -f status=success -f per_page=100)"
          artifacts="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/artifacts" -f name=trusted-assurance-state -f per_page=100)"
          artifact_id="$(jq -nr --argjson runs "$workflow_runs" --argjson artifacts "$artifacts" --argjson run_id "$GITHUB_RUN_ID" '[$runs.workflow_runs[].id] as $trusted_run_ids | [$artifacts.artifacts[] | select(.expired == false and .workflow_run.id != $run_id) | . as $artifact | select($trusted_run_ids | index($artifact.workflow_run.id))] | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$state_directory/state.zip"
            unzip -q "$state_directory/state.zip" -d "$state_directory"
            echo "path=$state_directory/trusted-assurance-state.json" >> "$GITHUB_OUTPUT"
            echo "Prior trusted assurance state retrieved."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No prior trusted assurance state is available."
          fi

      - name: Run synthetic assurance pipeline
        id: assurance-pipeline
        env:
          PREVIOUS_STATE_PATH: ${{ steps.prior-state.outputs.path }}
        run: |
          arguments=()
          if [ -n "$PREVIOUS_STATE_PATH" ]; then
            arguments+=(--previous-state "$PREVIOUS_STATE_PATH")
          fi
          python -m automation.cli "${arguments[@]}"

      - name: Plan GitHub governance workflow operations
        if: ${{ always() && (steps.assurance-pipeline.outcome == 'success' || steps.assurance-pipeline.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m integrations.github.cli --dry-run

      - name: Upload synthetic demonstration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-governance-assurance-${{ github.run_id }}
          path: |
            examples/machine-readable-control/generated-assurance/
            !examples/machine-readable-control/generated-assurance/trusted-assurance-state.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload trusted assurance state
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-assurance-state
          path: examples/machine-readable-control/generated-assurance/trusted-assurance-state.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
